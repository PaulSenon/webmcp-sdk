# TEMPORARY probe (never merged): does environment docs-preview's branch policy
# `refs/pull/*/merge` admit a pull_request run? No secret is read.
name: env-probe
on: pull_request
permissions: {}
concurrency:
  group: env-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: docs-preview
    permissions: {}
    steps:
      - run: echo "admitted with GITHUB_REF=$GITHUB_REF"
