# Monorepo Delivery Kit — site build (workflow `docs`; renamed per site by tooling/rename-site.mjs).
# UNPRIVILEGED: runs PR code (including forks), no secret, no environment, no id-token.
# Its start and completion trigger docs-deploy.yml (workflow_run): it comments, deploys the artifact
# built here, or tears the preview down when the PR is closed (only `lifecycle` runs then). Drafts
# are built and previewed like any open PR (kit D13): no converted_to_draft / ready_for_review.
# No pull_request_target anywhere (kit decision D2).
name: docs

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: docs-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lifecycle:
    name: lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          ACTION: ${{ github.event.action }}
        run: echo "event ${GITHUB_EVENT_NAME} ${ACTION:-}; docs-deploy.yml decides from the PR's current state"

  docs-build:
    name: docs-build
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    cache-mode: none # no Actions cache: this artifact is what production serves
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache: this job's artifact is what production serves (integrity > speed).
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - id: target
        name: Stage and URL (docs-deploy.yml recomputes both from trusted inputs)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The PR head, not the merge commit GitHub checks out: what workflow_run reports.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SUBDOMAIN: ${{ vars.DOCS_WORKERS_SUBDOMAIN }}
          PREVIEW_MODE: ${{ vars.DOCS_PREVIEW_MODE }}
        run: node infra/site/scripts/cli.ts build-target
      - name: Build the site
        env:
          SITE_URL: ${{ steps.target.outputs.url }}
        run: pnpm site:build
      - name: Manifest + artifact check (the same check the deploy runs)
        env:
          SITE_ARTIFACT_DIR: ${{ steps.target.outputs.dir }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STAGE: ${{ steps.target.outputs.stage }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
        run: |
          node infra/site/scripts/cli.ts write-manifest
          node infra/site/scripts/cli.ts check-artifact
      # Credential-free stand-in for a deploy: serve the artifact with `alchemy dev` (local
      # workerd, same asset router, this infra's headers/404 config) and run the deploy smoke test.
      - name: Serve locally and smoke test (no credentials)
        env:
          SITE_ARTIFACT_DIR: ${{ github.workspace }}/${{ steps.target.outputs.dir }}
        run: pnpm --filter ./infra/site run check:local
      # Artifact name = the site name (contract): docs-deploy.yml downloads exactly this from this run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: ${{ steps.target.outputs.dir }}
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }} # main builds kept for rollback
          if-no-files-found: error
          include-hidden-files: true # .well-known; check-artifact refuses other dotfiles
